<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Menu UL/LI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .menu {
            background-color: #f44336; 
            padding: 10px;
            display: flex;
            justify-content: flex-end; /* đẩy menu sang phải */
        }
        .menu ul {
            list-style: none; 
            margin: 0;
            padding: 0;
            display: flex;
        }
        .menu ul li {
            margin-left: 20px;
        }
        .menu ul li a {
            text-decoration: none;
            color: white;
            font-size: 14px;
        }
        .menu ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="menu">
        <ul>
            <li><a href="#">Thông Báo</a></li>
            <li><a href="#">Hỗ Trợ</a></li>
            <li><a href="#">Tiếng Việt</a></li>
            <li><a href="#">Đăng Ký</a></li>
            <li><a href="#">Đăng Nhập</a></li>
        </ul>
    </div>
</body>
</html>
