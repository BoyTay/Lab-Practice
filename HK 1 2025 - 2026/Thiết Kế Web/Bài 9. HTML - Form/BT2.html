<!DOCTYPE html>
<html>
    <head>
        <title>Black Goose Bistro | Pizza-on-Demand</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>Black Goose Bistro | Pizza-on-Demand</h1>
        <p>Our 12" wood-fired pizzas are available for delivery. Build your custom pizza and we'll deliver it within an hour.</p>
        
        <form action="http://blackgoosebistro.com/pizza.php" method="post">
            <fieldset>
                <legend>Your Information</legend>
                <p>
                    <label for="customername">Name:</label><br>
                    <input type="text" name="customername" id="customername" required>
                </p>
                <p>
                    <label for="address">Address:</label><br>
                    <input type="text" name="address" id="address" required>
                </p>
                <p>
                    <label for="telephone">Telephone Number:</label><br>
                    <input type="text" name="telephone" id="telephone" required>
                </p>
                <p>
                    <label for="email">Email:</label><br>
                    <input type="email" name="email" id="email" required>
                </p>
                <p>
                    <label for="instructions">Delivery instructions:</label><br>
                    <textarea name="instructions" id="instructions" placeholder="No more than 400 characters long" maxlength="400"></textarea>
                </p>
            </fieldset>

            <fieldset>
                <legend>Design Your Dream Pizza: Pizza specs</legend>
                
                <p><strong>Crust (Choose one):</strong></p>
                <label><input type="radio" name="crust" value="classic"> Classic white</label><br>
                <label><input type="radio" name="crust" value="multigrain"> Multigrain</label><br>
                <label><input type="radio" name="crust" value="cheese-stuffed"> Cheese-stuffed crust</label><br>
                <label><input type="radio" name="crust" value="gluten-free"> Gluten-free</label>

                <p><strong>Toppings (Choose as many as you want):</strong></p>
                <label><input type="checkbox" name="toppings[]" value="red-sauce" checked> Red sauce</label><br>
                <label><input type="checkbox" name="toppings[]" value="white-sauce"> White sauce</label><br>
                <label><input type="checkbox" name="toppings[]" value="mozzarella"> Mozzarella Cheese</label><br>
                <label><input type="checkbox" name="toppings[]" value="pepperoni"> Pepperoni</label><br>
                <label><input type="checkbox" name="toppings[]" value="mushrooms"> Mushrooms</label><br>
                <label><input type="checkbox" name="toppings[]" value="peppers"> Peppers</label><br>
                <label><input type="checkbox" name="toppings[]" value="anchovies"> Anchovies</label>

                <p>
                    <label for="number">How many pizzas:</label>
                    <select name="number" id="number">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>
                </p>
            </fieldset>

            <input type="submit" value="Bring me a pizza!">
            <input type="reset" value="Reset">
        </form>
    </body>
</html>
